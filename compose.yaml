services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - library

  api:
    build:
      context: ../test-manager-library-3145555-api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -lc "php artisan migrate --force && php artisan library:provision-admin && php artisan serve --host=0.0.0.0 --port=8000"
    env_file:
      - ${API_ENV_FILE:-../test-manager-library-3145555-api/.env}
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-library}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-5173}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - cover-files:/app/storage/app/covers
      - ../test-manager-library-3145555-api/.env:/app/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r ''exit(@file_get_contents("http://127.0.0.1:8000/health") === false ? 1 : 0);''',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library

  app:
    build:
      context: ../test-manager-library-3145555-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library

  page:
    build:
      context: ../test-manager-library-3145555-page
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PAGE_PORT:-8080}:80"
    networks:
      - library

  seed:
    profiles: ["seed"]
    build:
      context: ../test-manager-library-3145555-tool
      dockerfile: Dockerfile
    env_file:
      - ${API_ENV_FILE:-../test-manager-library-3145555-api/.env}
    environment:
      API_BASE_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library

volumes:
  postgres-data:
  cover-files:

networks:
  library:
    driver: bridge
